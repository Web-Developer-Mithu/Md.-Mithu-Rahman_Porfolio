    :root {
      --bg-reader: #0b0f19;
      --card-bg: rgba(20, 27, 43, 0.92);
      --border-color: rgba(255, 255, 255, 0.12);
      --accent: #ff4a57;
      --accent-hover: #ff2a3b;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --book-shadow: 0 25px 65px rgba(0, 0, 0, 0.8), 0 8px 30px rgba(0, 0, 0, 0.5);
    }

    [data-theme="sepia"] {
      --bg-reader: #251e18;
      --card-bg: rgba(42, 34, 27, 0.95);
      --border-color: rgba(230, 210, 180, 0.18);
      --accent: #d97706;
      --text-main: #fef3c7;
      --text-muted: #d5c4a1;
    }

    [data-theme="midnight"] {
      --bg-reader: #05050a;
      --card-bg: rgba(13, 14, 24, 0.95);
      --border-color: rgba(99, 102, 241, 0.25);
      --accent: #6366f1;
      --text-main: #e0e7ff;
      --text-muted: #818cf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Hind Siliguri', sans-serif;
      background-color: var(--bg-reader);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      transition: background-color 0.3s ease;
      user-select: none;
    }

    /* Top Navigation Toolbar */
    .reader-header {
      background: var(--card-bg);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--border-color);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      z-index: 100;
      position: sticky;
      top: 0;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text-main);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      padding: 6px 14px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-color);
      transition: all 0.2s;
    }

    .btn-back:hover {
      background: var(--accent);
      color: #fff;
      transform: translateX(-2px);
    }

    .book-meta-head h1 {
      font-size: 17px;
      font-weight: 700;
      margin: 0;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .book-meta-head span {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 400;
    }

    .header-center {
      flex: 1;
      max-width: 420px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .toc-select {
      width: 100%;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-family: 'Hind Siliguri', sans-serif;
      cursor: pointer;
      outline: none;
      transition: border-color 0.2s;
    }

    .toc-select:focus {
      border-color: var(--accent);
    }

    .toc-select option {
      background: #111827;
      color: #fff;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tool-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
    }

    .tool-btn:hover, .tool-btn.active {
      background: var(--accent);
      color: #fff;
    }

    .btn-pdf-download {
      background: rgba(255, 74, 87, 0.15);
      border-color: rgba(255, 74, 87, 0.35);
      color: #ff6b78;
    }

    .btn-pdf-download:hover {
      background: var(--accent);
      color: #fff;
    }

    /* Main Flipbook Stage */
    .reader-stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 10px;
      position: relative;
      overflow: hidden;
      perspective: 2500px;
    }

    .flipbook-zoom-container {
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.25s ease;
      transform-origin: center center;
    }

    .flipbook-wrapper {
      position: relative;
      filter: drop-shadow(var(--book-shadow));
    }

    #flipbook {
      margin: 0 auto;
      visibility: hidden;
    }

    #flipbook.ready {
      visibility: visible;
    }

    /* Page container & crisp image rendering */
    .page {
      background-color: #ffffff;
      overflow: hidden;
    }

    .page-content {
      width: 100%;
      height: 100%;
      position: relative;
      background-color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .page-img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: fill;
      /* Ultra-crisp rendering */
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    /* Side Nav Buttons */
    .nav-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 48px;
      height: 48px;
      background: rgba(15, 20, 32, 0.75);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border-color);
      color: #fff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      cursor: pointer;
      z-index: 50;
      transition: all 0.2s;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
    }

    .nav-arrow:hover {
      background: var(--accent);
      transform: translateY(-50%) scale(1.1);
    }

    .nav-arrow.prev-arrow { left: 15px; }
    .nav-arrow.next-arrow { right: 15px; }

    /* Bottom Control Bar */
    .reader-footer {
      background: var(--card-bg);
      backdrop-filter: blur(18px);
      border-top: 1px solid var(--border-color);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      z-index: 100;
    }

    .page-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-step {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-step:hover:not(:disabled) {
      background: var(--accent);
      color: #fff;
    }

    .btn-step:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .page-indicator {
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      min-width: 120px;
      text-align: center;
    }

    .slider-wrap {
      flex: 1;
      max-width: 500px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .page-slider {
      flex: 1;
      accent-color: var(--accent);
      height: 5px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 5px;
      cursor: pointer;
    }

    .zoom-level-text {
      font-size: 12px;
      font-family: monospace;
      color: var(--accent);
      min-width: 45px;
    }

    /* Loading Overlay */
    .book-loader {
      position: absolute;
      inset: 0;
      background: var(--bg-reader);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 15px;
      z-index: 200;
      transition: opacity 0.4s;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Mobile Responsive Adjustments */
    @media (max-width: 768px) {
      .reader-header {
        padding: 8px 12px;
        flex-wrap: wrap;
      }
      .book-meta-head span { display: none; }
      .header-center {
        order: 3;
        max-width: 100%;
        width: 100%;
        margin-top: 6px;
      }
      .nav-arrow { display: none; }
      .slider-wrap { display: none; }
      .reader-footer {
        padding: 8px 12px;
        justify-content: center;
      }
    }

</head>

  <!-- Page Flip Library -->
  <script src="assets/vendor/page-flip/page-flip.browser.js"></script>

  <script>
    const TOTAL_PAGES = 89;
    let soundEnabled = true;
    let audioCtx = null;
    let currentZoom = 1.0;

    // Realistic paper rustle sound generator via Web Audio API
    function playPaperSound() {
      if (!soundEnabled) return;
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }

        const bufferSize = audioCtx.sampleRate * 0.15;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1;
        }

        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(1200, audioCtx.currentTime);
        filter.Q.setValueAtTime(2.5, audioCtx.currentTime);

        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.01, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.25, audioCtx.currentTime + 0.04);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);

        noise.start();
      } catch (e) {
        console.warn("Audio not initialized:", e);
      }
    }

    document.addEventListener("DOMContentLoaded", function () {
      const flipbookEl = document.getElementById("flipbook");
      const zoomContainer = document.getElementById("zoomContainer");
      const pageIndicator = document.getElementById("pageIndicator");
      const pageSlider = document.getElementById("pageSlider");
      const prevBtn = document.getElementById("prevBtn");
      const nextBtn = document.getElementById("nextBtn");
      const prevArrow = document.getElementById("prevArrow");
      const nextArrow = document.getElementById("nextArrow");
      const tocSelect = document.getElementById("tocSelect");
      const loader = document.getElementById("loader");
      const zoomIn = document.getElementById("zoomIn");
      const zoomOut = document.getElementById("zoomOut");
      const zoomLevel = document.getElementById("zoomLevel");

      // High-resolution base dimension settings for Ultra-HD rendering
      const isMobile = window.innerWidth <= 768;
      const baseWidth = isMobile ? Math.min(window.innerWidth - 24, 440) : 560;
      const baseHeight = isMobile ? Math.floor(baseWidth * 1.418) : 794;

      const pageFlip = new St.PageFlip(flipbookEl, {
        width: baseWidth,
        height: baseHeight,
        size: "stretch",
        minWidth: 280,
        maxWidth: 1100,
        minHeight: 400,
        maxHeight: 1560,
        maxShadowOpacity: 0.5,
        showCover: true,
        mobileScrollSupport: false,
        useMouseEvents: true,
        swipeDistance: 25,
        drawShadow: true
      });

      // Load from real HTML DOM elements for native GPU rendering & zero blur
      pageFlip.loadFromHTML(document.querySelectorAll(".page"));

      pageFlip.on("init", () => {
        flipbookEl.classList.add("ready");
        setTimeout(() => {
          loader.style.opacity = "0";
          setTimeout(() => loader.style.display = "none", 400);
        }, 200);
      });

      pageFlip.on("flip", (e) => {
        playPaperSound();
        const current = e.data;
        updateUI(current);
      });

      function updateUI(pageNum) {
        pageSlider.value = pageNum;
        if (pageNum === 0) {
          pageIndicator.innerText = `প্রচ্ছদ`;
        } else if (pageNum >= TOTAL_PAGES - 1) {
          pageIndicator.innerText = `শেষ প্রচ্ছদ`;
        } else {
          pageIndicator.innerText = `পৃষ্ঠা ${pageNum} / ${TOTAL_PAGES - 1}`;
        }

        prevBtn.disabled = pageNum <= 0;
        nextBtn.disabled = pageNum >= TOTAL_PAGES - 1;

        // Auto select nearest TOC option
        const options = Array.from(tocSelect.options);
        for (let i = options.length - 1; i >= 0; i--) {
          if (pageNum >= parseInt(options[i].value, 10)) {
            tocSelect.selectedIndex = i;
            break;
          }
        }
      }

      // Zoom Controls
      function applyZoom(delta) {
        currentZoom = Math.min(Math.max(currentZoom + delta, 0.8), 1.8);
        zoomContainer.style.transform = `scale(${currentZoom})`;
        zoomLevel.innerText = `${Math.round(currentZoom * 100)}%`;
      }

      zoomIn.addEventListener("click", () => applyZoom(0.15));
      zoomOut.addEventListener("click", () => applyZoom(-0.15));
      zoomLevel.addEventListener("click", () => {
        currentZoom = 1.0;
        zoomContainer.style.transform = `scale(1.0)`;
        zoomLevel.innerText = `100%`;
      });

      // Prev / Next actions
      prevBtn.addEventListener("click", () => pageFlip.flipPrev());
      nextBtn.addEventListener("click", () => pageFlip.flipNext());
      prevArrow.addEventListener("click", () => pageFlip.flipPrev());
      nextArrow.addEventListener("click", () => pageFlip.flipNext());

      // Slider jump
      pageSlider.addEventListener("input", (e) => {
        const target = parseInt(e.target.value, 10);
        pageFlip.flip(target);
      });

      // Table of Contents jump
      tocSelect.addEventListener("change", (e) => {
        const target = parseInt(e.target.value, 10);
        pageFlip.flip(target);
      });

      // Keyboard navigation
      window.addEventListener("keydown", (e) => {
        if (e.key === "ArrowLeft") pageFlip.flipPrev();
        if (e.key === "ArrowRight") pageFlip.flipNext();
      });

      // Sound Toggle
      const soundToggle = document.getElementById("soundToggle");
      const soundIcon = document.getElementById("soundIcon");
      soundToggle.addEventListener("click", () => {
        soundEnabled = !soundEnabled;
        if (soundEnabled) {
          soundIcon.className = "bi bi-volume-up-fill";
          playPaperSound();
        } else {
          soundIcon.className = "bi bi-volume-mute-fill";
        }
      });

      // Theme toggle (dark -> sepia -> midnight -> dark)
      const themes = ["dark", "sepia", "midnight"];
      let themeIdx = 0;
      document.getElementById("themeToggle").addEventListener("click", () => {
        themeIdx = (themeIdx + 1) % themes.length;
        document.body.setAttribute("data-theme", themes[themeIdx]);
      });

      // Fullscreen Toggle
      document.getElementById("fullscreenToggle").addEventListener("click", () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
        } else {
          document.exitFullscreen().catch(() => {});
        }
      });
    });
  </script>
